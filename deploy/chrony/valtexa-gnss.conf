# chrony do Rover V3 (Jetson Orin NX): hora pelo GNSS (ZED-F9P) — docs/COMUNICACAO_FAZENDA.md §11.
# Copiar para /etc/chrony/conf.d/valtexa-gnss.conf (Ubuntu do JetPack) e reiniciar o chrony.
# NÃO TESTADO EM HARDWARE: o pino do PPS e o overlay pps-gpio dependem da placa carrier.
#
# 1) NMEA pelo gpsd (memória compartilhada SHM 0). Sozinho, erro de dezenas de ms (atraso
#    da serial); serve para "travar" o segundo do PPS.
refclock SHM 0 refid NMEA offset 0.200 delay 0.2 noselect
# 2) PPS: o pulso por segundo do TIMEPULSE do F9P num GPIO (overlay pps-gpio -> /dev/pps0).
#    Com ele, erro de microssegundos.
refclock PPS /dev/pps0 refid PPS lock NMEA prefer
# Sem PPS ligado: comente a linha de cima e use o NMEA sozinho (tire o "noselect").
#
# 3) Reserva: o NTP da base da fazenda pelo rádio (ela também tem GNSS). Antes de o GNSS
#    fixar (logo depois do boot) é ele que acerta o relógio.
server 10.30.0.1 iburst minpoll 4 maxpoll 6
#
# No boot o relógio pode estar muito errado (Jetson sem bateria de RTC): acerta de uma vez
# nas 3 primeiras medidas. Depois disso só desliza (o enlace usa o relógio monotônico para
# validade, e o Runtime confere a hora assinada da plataforma — PisoDaPlataforma).
makestep 1.0 3
rtcsync
leapsectz right/UTC
# O ensaio "relogio" (valtexa-rover ensaio relogio) lê `chronyc -c tracking` e `-c sources`.
