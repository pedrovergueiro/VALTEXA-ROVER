# /etc/systemd/system/valtexa-rover.service.d/rover-v3.conf — o que o Rover V3 acrescenta à
# unidade base (deploy/valtexa-rover.service).
[Unit]
# can0 e a rede das câmeras PoE precisam estar de pé antes do primeiro quadro.
After=systemd-networkd-wait-online.service

[Service]
# GPU (TensorRT/CUDA): video e render. Serial do ZED-F9P (/dev/ttyACM0): dialout.
# CAN e as OAK-D PoE (rede) não pedem grupo.
SupplementaryGroups=video render dialout
# /run/valtexa: missao.json, navegacao.json e parar.json, trocados com a pilha de navegação
# (que entra no grupo valtexa). Recriado vazio a cada partida do serviço.
RuntimeDirectory=valtexa
RuntimeDirectoryMode=0770
# O hardware.json fica com a configuração, fora do disco de dados.
Environment=VALTEXA_HARDWARE=/etc/valtexa/hardware.json
# TensorRT guarda o motor compilado do modelo (o primeiro carregamento leva minutos).
Environment=ORT_TENSORRT_ENGINE_CACHE_ENABLE=1
Environment=ORT_TENSORRT_CACHE_PATH=/var/lib/valtexa-rover/trt-cache
# tegrastats lê os sensores da placa; o Runtime o chama como subprocesso.
ReadOnlyPaths=/usr/bin/tegrastats
